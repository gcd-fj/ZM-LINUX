name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --release --bin zm-linux

  appimage:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev libdbus-1-dev
      - run: curl -L --fail -o /tmp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && chmod 0755 /tmp/linuxdeploy.AppImage
      - run: APPIMAGE_EXTRACT_AND_RUN=1 LINUXDEPLOY=/tmp/linuxdeploy.AppImage ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZM-LINUX-x86_64
          path: |
            dist/ZM-LINUX-x86_64.AppImage
            dist/ZM-LINUX-x86_64.AppImage.sha256
