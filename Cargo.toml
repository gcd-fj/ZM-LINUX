[workspace]
members = ["crates/zm-app", "crates/zm-assets", "crates/zm-auth", "crates/zm-core", "crates/zm-player"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
authors = ["gcd-fj"]

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
dirs = "6.0.0"
async-channel = "2.5.0"
async-task = "4.7.1"
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = "=0.33.3"
egui-wgpu = "=0.33.3"
encoding_rs = "0.8.35"
fontdb = "0.23"
flate2 = "1.1.9"
keyring = { version = "4.1.6", default-features = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10.6"
lzma-rs = "0.3.0"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.13.1", default-features = false, features = ["cookies", "form", "gzip", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.41"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
webbrowser = "1.1.0"
wgpu = "=27.0.1"

# Keep all Ruffle crates on one reviewed revision. The egui/wgpu versions
# above intentionally match this revision so both renderers share one device.
ruffle-core = { package = "ruffle_core", git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f", default-features = false, features = ["audio", "mp3", "aac", "nellymoser", "default_compatibility_rules", "default_font", "egui", "lzma"] }
ruffle-frontend-utils = { package = "ruffle_frontend_utils", git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f", default-features = false, features = ["cpal", "fs", "navigator", "rustls-tls"] }
ruffle-render-wgpu = { package = "ruffle_render_wgpu", git = "https://github.com/ruffle-rs/ruffle.git", rev = "a4f5b5256e245693bc9077ef6c6b6abc95490e7f" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
